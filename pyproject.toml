[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outreacho"
version = "0.5.0"
description = "Outreacho: The personal AI prospecting & autonomous outreach platform. Discovers target companies and decision-makers, enriches emails & social profiles, crafts hyper-personalized outreach, and automates deliverability."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
keywords = ["sales", "outreach", "ai-agent", "cold-email", "prospecting", "autonomous-agent", "deepseek", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt (used by Docker builds).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=5.1.3,<6",
    "aiosqlite>=0.19,<1",
    "keyring>=25,<26",
    # The menu-bar app (sellbird tray): macOS and Windows only.
    'pystray>=0.19.5,<0.20; sys_platform == "darwin" or sys_platform == "win32"',
    'Pillow>=10,<12; sys_platform == "darwin" or sys_platform == "win32"',
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.urls]
Homepage = "https://github.com/vanshsingh3711-wq/Outreach"
Issues = "https://github.com/vanshsingh3711-wq/Outreach/issues"

[project.scripts]
outreacho = "sellbird.cli:main"
sellbird = "sellbird.cli:main"
harvey = "harvey.cli:main"

[tool.setuptools.packages.find]
include = ["outreacho*", "sellbird*", "harvey*"]

# The editable defaults an installed app seeds its home folder from
# (sellbird/home.py). They land in <prefix>/share/sellbird.
[tool.setuptools.data-files]
"share/sellbird" = ["sellbird.yaml", ".env.example"]
"share/sellbird/prompts" = ["prompts/*.md"]
"share/sellbird/skills" = ["skills/*.md"]
"share/outreacho" = ["outreacho.yaml", ".env.example"]
"share/outreacho/prompts" = ["prompts/*.md"]
"share/outreacho/skills" = ["skills/*.md"]

# The dashboard's HTML/CSS/JS are real files served from disk, and its fonts
# are vendored so a local tool renders correctly with the network off.
[tool.setuptools.package-data]
sellbird = ["web/*", "web/fonts/*"]
outreacho = ["web/*", "web/fonts/*"]
