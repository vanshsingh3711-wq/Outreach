brain:
  provider: "deepseek"
  model: "deepseek-chat"

persona:
  name: "Vansh Singh"
  company: "Independent Developer"
  role: "Full-Stack & Backend Engineer"
  email: "vanshsingh0115@gmail.com"
  linkedin: "https://www.linkedin.com/in/vansh"
  tone: "concise, direct, authentic, engineer-to-founder"

product:
  name: "Contract Full-Stack & AI Engineering"
  description: "Building web apps, scalable backend services, API integrations, and AI/LLM workflows for tech startups and digital agencies."
  pricing: "Flexible hourly or project-based contract rates"
  key_benefits:
    - "Rapid delivery of MVPs, full-stack features, and API integrations with zero overhead"
    - "Clean, maintainable code across Python, TypeScript, React, Node, and FastAPI"
    - "Reliable developer bandwidth for backlog crunch, product sprints, and specialized modules"
  objection_responses:
    "not hiring right now": "Understood! If you ever need contract dev bandwidth or overflow help for a sprint, feel free to keep me in mind."
    "already have developers": "Makes complete sense. I often plug in as an extra pair of hands for ad-hoc modules or backlog crunch."
    "no budget": "Completely understand. Happy to stay in touch or help out if smaller scoped tasks come up later."
  offer:
    primary: "Contract engineering and freelance full-stack / backend development"
    entry: "A quick 15-minute intro chat to see if I can take any engineering tasks off your plate"
    goal: "get_reply"              # Goal of outreach: get_reply, book_call, start_trial
    booking_method: "ask_preference" # ask_preference, suggest_times, calendar_link
    booking_url: ""                # Calendar link URL (if using calendar_link method)
    meeting_duration: "15 minutes" # How long the call is
    meeting_owner: "Vansh"         # Who takes the meeting

icp:
  industries:
    - "Tech Startups"
    - "Software Development"
    - "Digital Agencies"
    - "SaaS"
    - "Product Studios"
  company_size: "1-50 employees"
  titles:
    - "Founder"
    - "Co-Founder"
    - "CTO"
    - "Head of Engineering"
    - "Engineering Manager"
    - "Technical Director"
    - "Managing Director"
  geography:
    - "United States"
    - "India"
    - "United Kingdom"
    - "Remote"
  # Roles that signal a company is in-market RIGHT NOW
  hiring_signals:
    - "Full Stack Engineer"
    - "Backend Engineer"
    - "Software Engineer"
    - "Python Developer"

channels:
  email:
    enabled: true
    provider: "smtp"           # using smtp with Gmail App Password for safe, direct delivery
    max_daily_sends: 15        # Safe limit for personal Gmail account
    require_approval: true      # native: review in Outbox; safety check before sending
    send_to_risky: true         # also send to catch-all domains — won't bounce, boosts reach ~20%
    max_bounce_rate: 0.05       # pause all sending if bounces exceed this
    warmup:
      start_date: ""            # 1.5 yr old Gmail needs no synthetic ramp; rate capped at 15/day
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""
    signature:
      logo: ""
      width: 120
      alt: ""
      link: ""
      direction: "auto"
  linkedin:
    enabled: true              # LinkedIn prospecting ON — finds decision makers by title
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/New_York"

compliance:
  postal_address: "New Delhi, India"
  opt_out_line: "Not interested or wrong timing? Just reply and let me know, and I won't follow up."
  do_not_contact: []
  precleared:
    enabled: false
    sender_country: ""
    address_source: "unknown"
    prospect_country: ""
    # Outreach also tells Precleared the recipient's country when the company's
    # location makes it certain, and the company's and person's names when
    # it has them (see docs/precleared.md).

# Optional: your own rules for the emails Outreach drafts (length, structure,
# what to say about the product, links, subject lines, sign-off), as a
# markdown file. When set they replace the built-in shape (email 1 under 75
# words, an observation and a question, no pitch). The send gate still holds
# every email to 220 words and one link. skills/email_rules.md is gitignored.
# writer:
#   email_rules: "skills/email_rules.md"

# When someone says yes to your offer, hand them to the system that delivers it:
# one tool on its MCP server. See outreach/handoff.py. Leave it out to handle it yourself.
# handoff:
#   mcp_url: https://example.com/mcp
#   token_env: EXAMPLE_MCP_TOKEN          # the .env variable holding its bearer token
#   tool: create_site
#   arguments:
#     company: "{company}"
#     website: "{website}"
#     email: "{email}"
