services:
  outreach:
    build:
      context: .
      args:
        OUTREACH_UID: ${OUTREACH_UID:-${HARVEY_UID:-1000}}
        OUTREACH_GID: ${OUTREACH_GID:-${HARVEY_GID:-1000}}
    # Supported on native Linux. Keep the dashboard's loopback-only bind.
    network_mode: host
    command: ["dashboard"]
    volumes:
      # Mount the checkout directory, not individual config files: setup and
      # training atomically replace files and create outreach.local.yaml.
      # Source, configuration, knowledge, and data therefore survive recreation.
      # Outreach reads .env itself; env_file would pin stale values at creation.
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: false
      # The Claude CLI refreshes OAuth tokens in place.
      - type: bind
        source: ${HOME}/.claude
        target: /home/outreach/.claude
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
